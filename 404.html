<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | Not Found</title>
   <link rel="icon" type="image/png" href="/quranALT.png?v=1">
    <!-- Intégration d'une police arabe élégante (Amiri) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --islamic-green: #064e3b;
            --islamic-green-light: #0f766e;
            --gold-primary: #d4af37;
            --gold-secondary: #f3e8ff;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Amiri', serif;
            background-color: var(--islamic-green);
            /* Motif géométrique islamique subtil en arrière-plan */
            background-image: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.05) 1px, transparent 1px),
                              radial-gradient(circle at 0 0, rgba(212, 175, 55, 0.03) 2px, transparent 2px);
            background-size: 40px 40px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
            border: 3px double var(--gold-primary);
            border-radius: 20px;
            background: rgba(6, 78, 59, 0.85);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 0 30px rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            margin: 20px;
        }

        /* Coins décoratifs de style arabesque */
        .container::before, .container::after {
            content: "✦";
            position: absolute;
            color: var(--gold-primary);
            font-size: 24px;
        }
        .container::before { top: 10px; right: 15px; }
        .container::after { bottom: 10px; left: 15px; }

        /* Calligraphie / Texte Arabe */
        .quran-text {
            font-size: 4.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        /* Ornement de séparation sous le mot Coran */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        .divider::before, .divider::after {
            content: "";
            height: 1px;
            width: 80px;
            background: var(--gold-gradient);
        }
        .divider-icon {
            color: var(--gold-primary);
            margin: 0 15px;
            font-size: 1.5rem;
        }

        /* Code d'erreur 404 */
        .error-code {
            font-size: 5.5rem;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-message {
            font-size: 1.5rem;
            color: #e2e8f0;
            margin-top: 5px;
            margin-bottom: 35px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Bouton Retour Accueil */
        .btn-back {
            display: inline-block;
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            color: var(--islamic-green);
            background: var(--gold-gradient);
            border: 2px solid transparent;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(179, 135, 40, 0.4);
        }

        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
            background: transparent;
            color: var(--gold-primary);
            border: 2px solid var(--gold-primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Texte Arabe : Le Coran -->
        <div class="quran-text">القُرْآن</div>
        
        <!-- Séparateur ornemental islamique -->
        <div class="divider">
            <span class="divider-icon">۞</span>
        </div>

        <!-- Section 404 Not Found -->
        <div class="error-code">404</div>
        <div class="error-message">Not Found</div>

        <!-- Bouton de retour à la racine / -->
        <a href="/" class="btn-back">العودة للرئيسية • Back to Home</a>
    </div>

</body>
</html>
